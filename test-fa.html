<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Font Awesome Test</title>
    <link rel="stylesheet" href="vender/fontawesome/fontawesome.min.css">
    <link rel="stylesheet" href="vender/fontawesome/solid.min.css">
</head>
<body>
    <h1>Font Awesome Test</h1>
    <p>Home icon: <i class="fas fa-home"></i></p>
    <p>User icon: <i class="fas fa-user-circle"></i></p>
    <p>Check icon: <i class="fas fa-check-circle"></i></p>
    <p>Download icon: <i class="fas fa-arrow-circle-down"></i></p>
    
    <div style="border: 1px solid black; padding: 10px; margin: 10px;">
        <h2>Simulated toolbar</h2>
        <ul style="list-style: none; display: flex; gap: 10px;">
            <li><span style="width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; background: #f0f0f0;"><i class="fas fa-home"></i></span></li>
            <li><span style="width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; background: #f0f0f0;"><i class="fas fa-user-circle"></i></span></li>
            <li><span style="width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; background: #f0f0f0;"><i class="fas fa-check-circle"></i></span></li>
            <li><span style="width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; background: #f0f0f0;"><i class="fas fa-arrow-circle-down"></i></span></li>
        </ul>
    </div>
</body>
</html>
